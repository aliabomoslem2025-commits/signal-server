name: Local device auth and server compile

on:
  push:
    branches:
      - feat/local-device-auth
  pull_request:
    branches:
      - main
      - feat/local-device-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-go:
    name: Build local-auth sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: local-auth/go.mod
      - name: Format Go source
        run: gofmt -w .
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test and compile
        run: go test ./...
      - name: Build local-auth container image
        run: docker build --pull -t signal-local-auth-ci:latest .
      - name: Validate local-auth Compose deployment
        env:
          LOCAL_AUTH_DB_PASSWORD: ci-db-password
          LOCAL_AUTH_ADMIN_TOKEN: ci-admin-token
          LOCAL_AUTH_INTERNAL_TOKEN: ci-internal-token
          LOCAL_AUTH_TICKET_HMAC_SECRET: ci-ticket-hmac-secret
          LOCAL_AUTH_ANDROID_ID_HASH_SECRET: ci-android-id-hash-secret
          LOCAL_AUTH_ALLOWED_ORIGINS: https://dashboard.lan
        run: docker compose config --quiet

  signal-server-java:
    name: Compile Signal server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Compile server modules
        run: ./mvnw -B -pl service -am -DskipTests -Dcheckstyle.skip -Dspotless.check.skip package

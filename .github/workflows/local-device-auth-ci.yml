name: Local device auth and server compile

on:
  push:
    branches:
      - feat/local-device-auth
  pull_request:
    branches:
      - main
      - feat/local-device-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-go:
    name: Build local-auth sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: local-auth/go.mod
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test and compile
        run: go test ./...

  signal-server-java:
    name: Compile Signal server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Compile server modules
        run: ./mvnw -B -pl service -am -DskipTests -Dcheckstyle.skip -Dspotless.check.skip package

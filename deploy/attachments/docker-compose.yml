services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_LOCAL_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_LOCAL_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [attachments-private]

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - ./minio-policy.json:/policy/minio-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        echo "Waiting for MinIO..."
        sleep 2
      done
      mc mb --ignore-existing local/attachments
      mc mb --ignore-existing local/backups
      mc admin policy create local signal-tus /policy/minio-policy.json || true
      mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
      mc admin policy attach local signal-tus --user "$$S3_ACCESS_KEY"
    networks: [attachments-private]

  tus-server:
    build:
      context: ./tus-server
    restart: unless-stopped
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "8096"
      BIND_ADDRESS: "0.0.0.0"
      TUS_PUBLIC_BASE_URL: ${TUS_PUBLIC_BASE_URL:?Set TUS_PUBLIC_BASE_URL, e.g. https://cdn3.lan}
      TUS_SHARED_AUTH_SECRET_BASE64: ${TUS_SHARED_AUTH_SECRET_BASE64:?Set the same 32-byte secret as Signal Server tus.userAuthenticationTokenSharedSecret}
      TUS_DATA_DIR: /var/lib/signal-tus
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_ATTACHMENTS_BUCKET: attachments
      S3_BACKUPS_BUCKET: backups
    ports:
      - "127.0.0.1:${TUS_LOCAL_PORT:-8096}:8096"
    volumes:
      - tus-staging:/var/lib/signal-tus
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8096/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks: [attachments-private]

volumes:
  minio-data:
  tus-staging:

networks:
  attachments-private:
    driver: bridge
